<!-- The tab icon: a small piece of the site's backdrop, as if cut out of a screenshot
     while the ambient light is on (components/GridInkBackdrop.jsx, palette 'mk-original',
     SETTINGS.ambient). Three of its horizontal grid lines, red to teal, run edge to
     edge over the tinted ground; two soft patches of light sit on them, each lighting a
     stretch of one line strongly and the middle line a little, with the glow spilling
     onto the ground between. public/apple-touch-icon.png is this drawing at 180px with square
     corners (the rect's rx and the clip removed). -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <defs>
    <clipPath id="face"><rect width="32" height="32" rx="7"/></clipPath>
    <!-- Ground: the dark base with the tile-face tint, warm at the left, cool at the right. -->
    <linearGradient id="ground" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="rgb(50, 22, 27)"/>
      <stop offset="1" stop-color="rgb(24, 37, 42)"/>
    </linearGradient>
    <!-- The lines' own gradient, across the whole icon as across the page. -->
    <linearGradient id="line" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="32" y2="0">
      <stop offset="0" stop-color="rgb(235, 70, 55)"/>
      <stop offset="1" stop-color="rgb(45, 215, 205)"/>
    </linearGradient>
    <!-- Light: soft round falloffs (stretched to each ellipse), warm for the left patch, cool for the right. -->
    <radialGradient id="warm">
      <stop offset="0" stop-color="rgb(240, 150, 125)" stop-opacity="1"/>
      <stop offset="1" stop-color="rgb(240, 150, 125)" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="cool">
      <stop offset="0" stop-color="rgb(90, 215, 205)" stop-opacity="1"/>
      <stop offset="1" stop-color="rgb(90, 215, 205)" stop-opacity="0"/>
    </radialGradient>
    <!-- The lit stretch of a line: bright in the middle, fading back into the line at both ends. -->
    <linearGradient id="litWarm" gradientUnits="userSpaceOnUse" x1="1" y1="0" x2="23" y2="0">
      <stop offset="0" stop-color="rgb(255, 226, 210)" stop-opacity="0"/>
      <stop offset="0.5" stop-color="rgb(255, 236, 224)" stop-opacity="1"/>
      <stop offset="1" stop-color="rgb(255, 226, 210)" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="litCool" gradientUnits="userSpaceOnUse" x1="10" y1="0" x2="32" y2="0">
      <stop offset="0" stop-color="rgb(200, 255, 250)" stop-opacity="0"/>
      <stop offset="0.5" stop-color="rgb(225, 255, 252)" stop-opacity="1"/>
      <stop offset="1" stop-color="rgb(200, 255, 250)" stop-opacity="0"/>
    </linearGradient>
    <!-- The same, fainter and shorter, where each patch reaches the middle line. -->
    <linearGradient id="litWarmFaint" gradientUnits="userSpaceOnUse" x1="2" y1="0" x2="16" y2="0">
      <stop offset="0" stop-color="rgb(255, 226, 210)" stop-opacity="0"/>
      <stop offset="0.5" stop-color="rgb(255, 236, 224)" stop-opacity="1"/>
      <stop offset="1" stop-color="rgb(255, 226, 210)" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="litCoolFaint" gradientUnits="userSpaceOnUse" x1="17" y1="0" x2="31" y2="0">
      <stop offset="0" stop-color="rgb(200, 255, 250)" stop-opacity="0"/>
      <stop offset="0.5" stop-color="rgb(225, 255, 252)" stop-opacity="1"/>
      <stop offset="1" stop-color="rgb(200, 255, 250)" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <rect width="32" height="32" rx="7" fill="url(#ground)"/>
  <g clip-path="url(#face)">
    <!-- Light on the ground around each patch. -->
    <ellipse cx="12" cy="9" rx="15" ry="11" fill="url(#warm)" opacity="0.3"/>
    <ellipse cx="21" cy="23" rx="15" ry="11" fill="url(#cool)" opacity="0.26"/>
    <!-- Halos on the lit stretches: strong on one line, fainter where the patch reaches the middle line. -->
    <ellipse cx="12" cy="6" rx="12" ry="3.4" fill="url(#warm)" opacity="0.85"/>
    <ellipse cx="9" cy="16" rx="7" ry="2.4" fill="url(#warm)" opacity="0.4"/>
    <ellipse cx="21" cy="26" rx="12" ry="3.4" fill="url(#cool)" opacity="0.8"/>
    <ellipse cx="24" cy="16" rx="7" ry="2.4" fill="url(#cool)" opacity="0.4"/>
    <!-- The grid lines. -->
    <path d="M0 6H32M0 16H32M0 26H32" stroke="url(#line)" stroke-width="1.3" fill="none"/>
    <!-- The lit stretches, brighter and a touch thicker. -->
    <path d="M1 6H23" stroke="url(#litWarm)" stroke-width="1.9" fill="none"/>
    <path d="M2 16H16" stroke="url(#litWarmFaint)" stroke-width="1.5" stroke-opacity="0.5" fill="none"/>
    <path d="M10 26H32" stroke="url(#litCool)" stroke-width="1.9" fill="none"/>
    <path d="M17 16H31" stroke="url(#litCoolFaint)" stroke-width="1.5" stroke-opacity="0.5" fill="none"/>
  </g>
</svg>
