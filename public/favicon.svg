<!-- The tab icon: the site's backdrop in small. Three of its horizontal grid lines growing
     across from the left edge, red to teal, each ending in its glowing tip, on the ground
     colour (components/GridInkBackdrop.jsx, palette 'mk-original'). The lines' gradient
     runs across the whole icon, as it does across the page, so a shorter line stops
     earlier in it. public/apple-touch-icon.png is this drawing at 180px with square corners. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <defs>
    <linearGradient id="line" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="32" y2="0">
      <stop offset="0" stop-color="rgb(235, 70, 55)"/>
      <stop offset="1" stop-color="rgb(45, 215, 205)"/>
    </linearGradient>
    <clipPath id="face"><rect width="32" height="32" rx="7"/></clipPath>
  </defs>
  <rect width="32" height="32" rx="7" fill="rgb(12, 12, 14)"/>
  <g clip-path="url(#face)">
    <path d="M0 8.5H20" stroke="url(#line)" stroke-width="3" fill="none"/>
    <path d="M0 16H26.5" stroke="url(#line)" stroke-width="3" fill="none"/>
    <path d="M0 23.5H13.5" stroke="url(#line)" stroke-width="3" fill="none"/>
    <circle cx="20" cy="8.5" r="4" fill="rgb(116, 161, 149)" fill-opacity="0.35"/>
    <circle cx="20" cy="8.5" r="2.4" fill="rgb(172, 199, 191)"/>
    <circle cx="26.5" cy="16" r="4" fill="rgb(78, 190, 179)" fill-opacity="0.35"/>
    <circle cx="26.5" cy="16" r="2.4" fill="rgb(149, 216, 209)"/>
    <circle cx="13.5" cy="23.5" r="4" fill="rgb(155, 131, 118)" fill-opacity="0.35"/>
    <circle cx="13.5" cy="23.5" r="2.4" fill="rgb(195, 181, 173)"/>
  </g>
</svg>
